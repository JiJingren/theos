name: Windows installer test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bin/install-theos'
      - 'bin/install-sdk'
      - 'bin/update-theos'
      - '.github/workflows/windows-installer.yml'

jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Run install-theos from a clean home
        shell: C:\msys64\usr\bin\bash.exe --noprofile --norc -e -o pipefail {0}
        run: |
          export PATH="/c/msys64/usr/bin:/c/msys64/mingw64/bin:$PATH"
          export HOME=/c/gha-home
          rm -rf "$HOME"
          mkdir -p "$HOME"
          unset THEOS
          echo "=== uname / arch ==="
          uname
          uname -m
          echo "=== running installer ==="
          "$GITHUB_WORKSPACE/bin/install-theos"
          echo "=== shell env written ==="
          cat "$HOME/.bashrc" "$HOME/.bash_profile" "$HOME/.profile" 2>/dev/null || true

      - name: Verify installation
        shell: C:\msys64\usr\bin\bash.exe --noprofile --norc -e -o pipefail {0}
        run: |
          export PATH="/c/msys64/usr/bin:/c/msys64/mingw64/bin:$PATH"
          export HOME=/c/gha-home
          source "$HOME/.bashrc" 2>/dev/null || source "$HOME/.bash_profile" 2>/dev/null || source "$HOME/.profile"
          echo "THEOS=$THEOS"
          test -x "$THEOS/bin/nic.pl"
          test -x "$THEOS/toolchain/windows/iphone/bin/clang.exe"
          test -x "$THEOS/toolchain/windows/iphone/bin/ld.exe"
          ls -la "$THEOS/sdks"
          "$THEOS/toolchain/windows/iphone/bin/clang.exe" --version | head -3

      - name: Build a tweak with the installed Theos
        shell: C:\msys64\usr\bin\bash.exe --noprofile --norc -e -o pipefail {0}
        run: |
          export PATH="/c/msys64/usr/bin:/c/msys64/mingw64/bin:$PATH"
          export HOME=/c/gha-home
          source "$HOME/.bashrc" 2>/dev/null || source "$HOME/.bash_profile" 2>/dev/null || source "$HOME/.profile"
          mkdir -p /tmp/instwext && cd /tmp/instwext
          printf 'ARCHS = arm64 arm64e\nTARGET = iphone:clang:latest:11.0\nPACKAGE_VERSION = 0.0.1\nINSTALL_TARGET_PROCESSES = SpringBoard\ninclude $(THEOS)/makefiles/common.mk\n\nTWEAK_NAME = InstWin\nInstWin_FILES = Tweak.x\ninclude $(THEOS_MAKE_PATH)/tweak.mk\n' > Makefile
          printf '#import <UIKit/UIKit.h>\n%%hook SpringBoard\n- (void)applicationDidFinishLaunching:(id)app {\n  NSLog(@"[InstWin] loaded");\n}\n%%end\n' > Tweak.x
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n\t<key>Filter</key>\n\t<dict>\n\t\t<key>Bundles</key>\n\t\t<array>\n\t\t\t<string>com.apple.springboard</string>\n\t\t</array>\n\t</dict>\n</dict>\n</plist>\n' > InstWin.plist
          printf 'Package: com.example.instwin\nName: InstWin\nVersion: 0.0.1\nArchitecture: iphoneos-arm64\nDescription: installer test build\nMaintainer: example\nAuthor: example\nSection: Tweaks\nDepends: mobilesubstrate\n' > control
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME= THEOS_LDFLAGS= 2>&1 | tail -60
          ls -la packages/
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp -v packages/*.deb "$GITHUB_WORKSPACE/out/"
          cd /tmp && mkdir -p instx && cd instx && rm -rf ./* && ar x /tmp/instwext/packages/*.deb
          echo "--- package layout ---"
          ls -la
          tar -tzf control.tar.gz
          tar -tf data.tar.lzma

      - name: Re-run installer (idempotency)
        shell: C:\msys64\usr\bin\bash.exe --noprofile --norc -e -o pipefail {0}
        run: |
          export PATH="/c/msys64/usr/bin:/c/msys64/mingw64/bin:$PATH"
          export HOME=/c/gha-home
          source "$HOME/.bashrc" 2>/dev/null || source "$HOME/.bash_profile" 2>/dev/null || source "$HOME/.profile"
          echo "=== second run ==="
          "$THEOS/bin/install-theos"
          echo "=== third run with THEOS already exported ==="
          "$THEOS/bin/install-theos"

      - name: Installer without pacman must fail with 3
        shell: C:\msys64\usr\bin\bash.exe --noprofile --norc -e -o pipefail {0}
        run: |
          export PATH="/c/msys64/usr/bin:/c/msys64/mingw64/bin:$PATH"
          export HOME=/c/gha-nopacman
          rm -rf "$HOME" && mkdir -p "$HOME" /tmp/nopacman/bin
          for t in bash sh uname ls mkdir cat git curl tar xz zip make perl rsync diff env printf cut grep sed; do
            p="$(command -v $t 2>/dev/null)" && ln -sf "$p" "/tmp/nopacman/bin/$t" || true
          done
          unset THEOS
          set +e
          PATH="/tmp/nopacman/bin" /c/msys64/usr/bin/bash.exe --noprofile --norc "$GITHUB_WORKSPACE/bin/install-theos"
          rc=$?
          echo "exit code: $rc"
          test "$rc" -eq 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-deb
          path: out/*.deb
          if-no-files-found: ignore
